<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>TIMO Match - 과목 프로젝트 현황</title>
  <link rel="stylesheet" href="/css/first-login.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/classes.css">
  <style>
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999; color: #fff;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3);
      border-radius: 50%; border-top-color: var(--primary-bg);
      animation: spin 1s ease-in-out infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-backdrop {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index: 9000; display: flex; justify-content: center; align-items: center;
    }
    .report-modal {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; width: 90%; max-width: 700px; padding: 32px;
      max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .metrics-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0;
    }
    .metric-box {
      background: var(--glass-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 12px; text-align: center;
    }
    .metric-box div { font-size: 24px; font-weight: 800; color: var(--primary-bg); margin-top: 4px; }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem('timo_theme') === 'dark') document.body.classList.add('dark-mode');
  </script>

  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <h2 id="loadingStatus" style="font-weight: 700; letter-spacing: -0.5px;">GitHub Repository 커넥션 수립 중...</h2>
    <p style="opacity: 0.7; margin-top: 8px;">실시간 형상 관리 데이터 전수 파싱 중</p>
  </div>

  <div id="reportModalBackdrop" class="modal-backdrop" style="display: none;">
    <div class="report-modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 id="modalProjectTitle" style="margin:0; font-size:22px; font-weight:800;">프로젝트 AI 종합 분석 보고서</h2>
        <button class="btn-secondary" onclick="closeReportModal()" style="height:32px; padding:0 12px;">닫기</button>
      </div>
      
      <div class="metrics-grid">
        <div class="metric-box">총 커밋 수<div id="mTotalCommits">0</div></div>
        <div class="metric-box">총 PR 수<div id="mTotalPRs">0</div></div>
        <div class="metric-box">PR 병합<div id="mMerged">0</div></div>
        <div class="metric-box">진행 중(Open)<div id="mOpen">0</div></div>
      </div>

      <div class="section-card" style="background:var(--primary-container); border:none; margin-bottom:16px; padding:16px;">
        <h4 style="margin:0 0 6px 0; color:var(--on-primary-container); font-size:14px;">형상 관리 요약</h4>
        <p id="rSummary" style="margin:0; font-size:14px; line-height:1.6; color:var(--on-primary-container);"></p>
      </div>

      <div class="section-card" style="margin-bottom:16px; padding:16px;">
        <h4 style="margin:0 0 6px 0; font-size:14px; color:var(--text-primary);">교수 지점 협업 평가 의견 (AI 진단)</h4>
        <p id="rEval" style="margin:0; font-size:14px; line-height:1.6; color:var(--text-secondary);"></p>
      </div>

      <h4 style="font-size:14px; margin:20px 0 10px 0;">팀원별 기여도 및 작업 분배 (최근 100 커밋 기준)</h4>
      <div id="contributorListContainer" class="list-grid" style="margin-bottom: 24px; gap: 8px;"></div>

      <h4 style="font-size:14px; margin:20px 0 10px 0;">최근 Pull Request 타임라인</h4>
      <div id="prTimelineContainer" class="list-grid" style="gap: 8px;"></div>
    </div>
  </div>

  <div class="app-layout">
    <nav id="gnb-container" class="gnb-container"></nav>
    <main class="main-content">
      <div class="page-header">
        <h1 id="classDetailTitle">과목 상세 현황</h1>
        <p>학생들이 연동 제출한 실시간 GitHub 레포지토리 목록을 관리하고 AI 소스코드 진단을 수행합니다.</p>
      </div>
      <div class="section-card">
        <h3>제출된 프로젝트 레포지토리 내역</h3>
        <div id="projectGrid" class="list-grid">
          <p style="color:var(--text-secondary); margin:0;">데이터 로딩 중...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth-guard.js"></script>
  <script src="/js/class-detail.js"></script>
</body>
</html>
