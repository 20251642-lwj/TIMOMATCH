<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PRism - 과목 상세</title>
  <link rel="stylesheet" href="/css/first-login.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/classes.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  
  <div id="submitProjectModal" class="modal-backdrop" style="display: none;">
    <div class="prompt-modal">
      <h2 style="margin:0 0 8px 0; font-size:20px; font-weight:800; color:var(--text-primary);">새 프로젝트 팀 개설</h2>
      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:24px; line-height:1.5;">
        새로운 프로젝트를 생성하고 팀장(LEADER) 권한을 부여받습니다.
      </p>
      <div class="input-group" style="margin-bottom: 16px;">
        <label>프로젝트 이름</label>
        <input type="text" id="submitTitle" class="prompt-textarea" style="padding: 12px; margin-bottom:0; height: auto; width: 100%; box-sizing: border-box;" placeholder="예: TIMO Match 프론트엔드">
      </div>
      <div class="input-group" style="margin-bottom: 16px;">
        <label>GitHub 레포지토리 URL</label>
        <input type="text" id="submitGithubUrl" class="prompt-textarea" style="padding: 12px; margin-bottom:0; height: auto; width: 100%; box-sizing: border-box;" placeholder="https://github.com/username/repo">
      </div>
      <div class="input-group" style="margin-bottom: 24px;">
        <label>프로젝트 목표 (AI 핵심 평가 기준)</label>
        <textarea id="submitGoal" class="prompt-textarea" rows="3" style="margin-bottom:0; width: 100%; box-sizing: border-box;" placeholder="예: 해커톤 출품을 위한 빠른 프로토타입 완성 및 협업"></textarea>
      </div>
      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button class="btn-secondary" onclick="closeSubmitModal()" style="height:44px; padding:0 20px;">취소</button>
        <button class="btn-submit" onclick="submitNewProject()" style="height:44px; padding:0 24px; flex:none;">개설하기</button>
      </div>
    </div>
  </div>

  <div id="joinProjectModal" class="modal-backdrop" style="display: none;">
    <div class="prompt-modal">
      <h2 style="margin:0 0 8px 0; font-size:20px; font-weight:800; color:var(--text-primary);">기존 프로젝트 팀 합류</h2>
      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:24px; line-height:1.5;">
        현재 과목에 개설된 프로젝트 팀 목록입니다. 본인의 팀을 선택하여 합류하세요.
      </p>
      <div class="input-group" style="margin-bottom: 24px;">
        <label>프로젝트 팀 선택</label>
        <select id="joinProjectSelect" class="prompt-textarea" style="width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--card-border); border-radius: 8px; box-sizing: border-box; cursor: pointer;"></select>
      </div>
      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button class="btn-secondary" onclick="closeJoinModal()" style="height:44px; padding:0 20px;">취소</button>
        <button class="btn-submit" onclick="submitJoinProject()" style="height:44px; padding:0 24px; flex:none;">합류하기</button>
      </div>
    </div>
  </div>

  <div id="promptModalBackdrop" class="modal-backdrop" style="display: none;">
    <div class="prompt-modal">
      <h2 style="margin:0 0 12px 0; font-size:20px; font-weight:800; color:var(--text-primary);">AI 진단 포커스 설정</h2>
      <div class="category-grid">
        <div class="cat-chip" data-val="작업 분배" onclick="toggleCategory(this)">작업 분배 (Contribution)</div>
        <div class="cat-chip" data-val="PR 빈도" onclick="toggleCategory(this)">PR 리뷰 활성화</div>
        <div class="cat-chip" data-val="커밋 주기" onclick="toggleCategory(this)">커밋 주기 및 쪼개기</div>
        <div class="cat-chip" data-val="네이밍 컨벤션" onclick="toggleCategory(this)">브랜치/커밋 네이밍 규칙</div>
      </div>
      <textarea id="customPromptInput" class="prompt-textarea" rows="3" placeholder="추가적으로 AI가 중점적으로 확인했으면 하는 사항을 자유롭게 입력하세요."></textarea>
      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button class="btn-secondary" onclick="closePromptModal()" style="height:44px; padding:0 20px;">취소</button>
        <button class="btn-submit" onclick="executeAnalysis()" style="height:44px; padding:0 24px; flex:none;">진단 시작</button>
      </div>
    </div>
  </div>

  <div class="app-layout">
    <nav id="gnb-container" class="gnb-container"></nav>
    <main class="main-content">
      <div class="content-wrapper">
        
        <div class="page-header">
          <button onclick="location.href='/dashboard.html'" class="btn-secondary" style="margin-bottom: 16px; height: 32px; padding: 0 16px; font-size: 13px;">← 대시보드로 돌아가기</button>
          <h1 id="classTitle">과목 로딩 중...</h1>
          <p id="classSubtitle">해당 과목의 프로젝트 현황입니다.</p>
        </div>
        
        <div id="projectGrid" class="list-grid">
          <p style="color:var(--text-secondary);">데이터 로드 중...</p>
        </div>

      </div>
    </main>
  </div>

  <script src="/js/auth-guard.js"></script>
  <script src="/js/class-detail.js"></script>
</body>
</html>
