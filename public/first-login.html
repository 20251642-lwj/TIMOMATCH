<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>TIMO Match - 역할 선택</title>
  <link rel="stylesheet" href="/css/first-login.css">
</head>
<body>
  <script>
    if (localStorage.getItem('timo_theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>

  <div class="container">
    <div id="step1" class="step-container">
      <h1>환영합니다! 역할을 선택해주세요.</h1>
      <p>시스템을 이용하기 위해 본인의 역할을 확정해야 합니다.<br>한 번 선택한 역할은 변경할 수 없습니다.</p>
      
      <div class="role-grid">
        <div class="role-card" id="card-student" onclick="selectRole('STUDENT')">
          <div class="role-title">학생 (Student)</div>
          <div class="role-desc">과목에 참여하고<br>프로젝트를 등록합니다.</div>
        </div>
        <div class="role-card" id="card-prof" onclick="selectRole('PROFESSOR')">
          <div class="role-title">교수 (Professor)</div>
          <div class="role-desc">과목을 개설하고<br>학생들을 모니터링합니다.</div>
        </div>
      </div>
    </div>

    <div id="step2" class="step-container" style="display: none;">
      <h1>기본 정보 입력</h1>
      <p>신원 확인을 위해 정확한 소속 정보를 입력해주세요.</p>
      
      <div class="input-group">
        <label for="univSearch">소속 대학교</label>
        <div class="search-container">
          <input type="text" id="univSearch" placeholder="대학교 이름을 검색하세요" autocomplete="off">
          <div id="univDropdown" class="dropdown-list" style="display: none;"></div>
        </div>
      </div>

      <div class="input-group">
        <label for="realName">실명</label>
        <input type="text" id="realName" placeholder="본인의 실명을 입력하세요">
      </div>
      
      <div class="input-group" id="userNumberGroup">
        <label id="userNumberLabel" for="userNumber">식별 번호</label>
        <input type="text" id="userNumber" placeholder="번호를 입력하세요">
      </div>

      <div class="btn-group">
        <button class="btn-secondary" onclick="goToStep(1)">이전</button>
        <button id="step2NextBtn" class="btn-submit" onclick="handleStep2Next()" disabled>다음 단계로</button>
      </div>
    </div>

    <div id="step3" class="step-container" style="display: none;">
      <h1>기술 스택 선택</h1>
      <p>주력으로 사용하거나 학습 중인 기술을 선택해주세요.<br>(다중 선택 가능)</p>
      
      <div id="techStackContainer" class="chip-grid">
        </div>

      <div class="btn-group">
        <button class="btn-secondary" onclick="goToStep(2)">이전</button>
        <button id="submitBtn" class="btn-submit" onclick="submitRole()">최종 확정 및 시작하기</button>
      </div>
    </div>

  </div>

  <script src="/js/first-login.js"></script>
</body>
</html>
