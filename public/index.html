<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>TIMO Match - 깃허브 트러블슈팅 매칭</title>
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <script>
    if (localStorage.getItem('timo_theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>

  <div class="floating-bg">
    <div class="snippet snippet-1">
      <span class="keyword">commit</span> <span class="hash">a1b2c3d</span><br>
      <span class="string">"refactor: optimize matching algorithm"</span>
    </div>
    <div class="snippet snippet-2">
      <span class="keyword">const</span> match = <span class="keyword">await</span> <span class="function">findBestPartner</span>(user);<br>
      <span class="comment">// Returns the optimal teammate</span>
    </div>
    <div class="snippet snippet-3">
      <span class="keyword">Merge</span> pull request <span class="hash">#42</span> from feature/ai-review<br>
      <span class="comment">Adds automated PR analysis</span>
    </div>
    <div class="snippet snippet-4">
      [SUCCESS] <span class="function">Build passing</span> in 1m 24s<br>
      <span class="comment">All 142 tests passed.</span>
    </div>
  </div>

  <a href="/" class="header-logo">TIMOMATCH</a>
  
  <button id="themeToggle" class="theme-toggle">Dark Mode</button>

  <div class="main-wrapper">
    <div class="text-container">
      <div class="typing-container">
        <span id="typingText"></span><span class="cursor"></span>
      </div>
    </div>
    
    <div class="login-container">
      <button class="btn-github" id="loginBtn" onclick="handleLoginClick()">GitHub로 시작하기</button>
    </div>
  </div>

  <script src="/js/index.js"></script>
</body>
</html>
