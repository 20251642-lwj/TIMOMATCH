<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>TIMO Match - 수강 과목 및 프로젝트</title>
  <link rel="stylesheet" href="/css/first-login.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/classes.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="app-layout">
    <nav id="gnb-container" class="gnb-container"></nav>

    <main class="main-content">
      <div class="content-wrapper">
        <div class="page-header">
          <h1 id="pageTitle">과목 및 프로젝트 관리</h1>
          <p id="pageDescription">과목을 선택하여 입장한 뒤, 팀 프로젝트를 제출하거나 AI 분석 현황을 관리하세요.</p>
        </div>

        <div id="profActionCard" class="section-card" style="display: none;">
          <h3>새 과목 개설</h3>
          <div class="inline-form" style="display: flex; gap: 12px; align-items: stretch;">
            <input type="text" id="classNameInput" class="prompt-textarea" style="margin: 0; flex: 1; padding: 10px 16px; height: 40px; box-sizing: border-box;" placeholder="과목 이름 (예: 소프트웨어 공학)">
            <button class="btn-submit" onclick="handleCreateClass()">과목 개설 및 초대 코드 발급</button>
          </div>
          <div id="creationResult" class="result-alert" style="display: none;"></div>
        </div>

        <div id="studentActionCard" class="section-card student-enroll-theme" style="display: none;">
          <h3>수강 과목 등록</h3>
          <p class="enroll-sub-text">교수님이 공유한 초대 코드를 입력하세요.</p>
          <div class="inline-form" style="display: flex; gap: 12px; align-items: stretch;">
            <input type="text" id="inviteCode" class="prompt-textarea" style="margin: 0; flex: 1; padding: 10px 16px; height: 40px; box-sizing: border-box;" placeholder="TIMO-XXXXXX">
            <button class="btn-submit" onclick="handleEnrollClass()">과목 등록</button>
          </div>
          <p id="enrollMessage" class="status-msg" style="display: none;"></p>
        </div>

        <div class="section-card">
          <h3 id="listCardTitle">내 과목 목록</h3>
          <div id="classListContainer" class="list-grid">
            <p style="color: var(--text-secondary); margin: 0;">데이터를 불러오는 중...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth-guard.js"></script>
  <script src="/js/classes.js"></script>
</body>
</html>
